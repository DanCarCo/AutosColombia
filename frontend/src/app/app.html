<div class="page-shell">
  <header class="site-header">
    <a class="brand" routerLink="/" aria-label="Autos Colombia, inicio">
      <span class="brand-mark" aria-hidden="true">AC</span><span>Autos Colombia</span>
    </a>
    <nav aria-label="Navegación principal">
      <a
        routerLink="/"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }"
        ariaCurrentWhenActive="page"
        >Inicio</a
      >
      <a routerLink="/control-acceso" routerLinkActive="active" ariaCurrentWhenActive="page"
        >Control de acceso</a
      >
      <a routerLink="/gestion/operadores" routerLinkActive="active" ariaCurrentWhenActive="page"
        >Operadores</a
      >
      <a routerLink="/gestion/celdas" routerLinkActive="active" ariaCurrentWhenActive="page"
        >Celdas</a
      >
      <a routerLink="/gestion/vehiculos" routerLinkActive="active" ariaCurrentWhenActive="page"
        >Vehículos</a
      >
      <a routerLink="/gestion/clientes" routerLinkActive="active" ariaCurrentWhenActive="page"
        >Clientes</a
      >
    </nav>
    <div class="session-nav">
      @if (auth.operador(); as operador) {
        <span>{{ operador.nombre }}</span>
        <button type="button" (click)="auth.logout()">Cerrar sesión</button>
      } @else {
        <a routerLink="/login" routerLinkActive="active" ariaCurrentWhenActive="page"
          >Iniciar sesión</a
        >
      }
    </div>
  </header>
  <main><router-outlet /></main>
  <footer><span>Autos Colombia</span><span>Control vehicular con claridad.</span></footer>
</div>
